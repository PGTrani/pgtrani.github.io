<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastorale Giovanile</title>
  <meta name="description" content="Pastorale Giovanile dell'Arcidiocesi di Trani-Barletta-Bisceglie">
  <meta name="theme-color" content="#1356b4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d3a7a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="assets/img/logo-pg-diocesi.png">
  <link rel="apple-touch-icon" href="assets/img/logo-pg-diocesi.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Figtree:wght@400..700&amp;display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="sea">
    <div class="sea-inner">
      <img class="logo" src="assets/img/logo-pg-diocesi.png" alt="Pastorale Giovanile Arcidiocesi Trani-Barletta-Bisceglie" width="104" height="104">
      <h1>Pastorale Giovanile</h1>
      <p>Arcidiocesi di Trani-Barletta-Bisceglie</p>
    </div>
    <svg class="waves" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path d="M0 28C180 12 540 44 720 28S1260 44 1440 28S1980 44 2160 28S2700 44 2880 28V80H0Z"/>
      <path d="M0 46C180 32 540 60 720 46S1260 60 1440 46S1980 60 2160 46S2700 60 2880 46V80H0Z"/>
      <path d="M0 62C180 52 540 72 720 62S1260 72 1440 62S1980 72 2160 62S2700 72 2880 62V80H0Z"/>
    </svg>
  </header>

  <main>
    <nav class="list" aria-label="Diocesi">
      <a class="row" href="diocesi/">
        <span class="tile"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#cross"/></svg></span>
        <span class="label">Diocesi<small>Meeting ed eventi diocesani</small></span>
        <svg class="i go" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg>
      </a>
    </nav>

    <h2 id="citta">Scegli la tua città</h2>
    <nav class="list" aria-labelledby="citta">
      <a class="row" href="trani/">
        <span class="tile"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#map-pin"/></svg></span>
        <span class="label">Trani<small>Calendario ed eventi</small></span>
        <svg class="i go" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg>
      </a>
      <div class="row soon">
        <span class="tile"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#map-pin"/></svg></span>
        <span class="label">Barletta</span>
        <span class="badge">In arrivo</span>
      </div>
      <div class="row soon">
        <span class="tile"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#map-pin"/></svg></span>
        <span class="label">Bisceglie</span>
        <span class="badge">In arrivo</span>
      </div>
      <div class="row soon">
        <span class="tile"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#map-pin"/></svg></span>
        <span class="label">Corato</span>
        <span class="badge">In arrivo</span>
      </div>
      <div class="row soon">
        <span class="tile"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#map"/></svg></span>
        <span class="label">Forania</span>
        <span class="badge">In arrivo</span>
      </div>
    </nav>
  </main>

  <footer>Pastorale Giovanile · Arcidiocesi di Trani-Barletta-Bisceglie</footer>
</body>
</html>
